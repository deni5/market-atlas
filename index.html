<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market·Atlas — models for price, risk &amp; anomaly detection</title>
<meta name="description" content="A field index of models and functions used to forecast prices, estimate risk and detect anomalies in financial markets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="topbar-row">
      <div class="logo">Market<span class="dot">·</span>Atlas</div>
      <div class="topbar-right">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchBox" type="search" placeholder="…" aria-label="Search models">
        </div>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme">☾</button>
        <div class="lang-toggle" role="group" aria-label="Language">
          <span id="langUk">UK</span><span id="langEn">EN</span>
        </div>
      </div>
    </div>
    <div class="topnav-header">
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="true">
        <span id="navToggleIcon">▾</span> <span id="navToggleLabel">Теми</span> <span id="navToggleCount" class="nav-toggle-count"></span>
      </button>
    </div>
    <nav class="topnav" id="topNav" aria-label="Topic catalogue"></nav>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroTitle"></h1>
    <p id="heroP1"></p>
    <p id="heroP2"></p>
    <p class="credit" id="heroCredit"></p>
  </section>

  <section class="filters">
    <p class="filters-label" id="filtersLabel"></p>
    <div class="chip-row" id="levelChips">
      <div class="chip on" data-lvl="I"><span class="k">I</span> <span id="levelILabel"></span></div>
      <div class="chip on" data-lvl="II"><span class="k">II</span> <span id="levelIILabel"></span></div>
      <div class="chip on" data-lvl="III"><span class="k">III</span> <span id="levelIIILabel"></span></div>
    </div>
    <div class="meta-row">
      <span class="count-pill" id="metaLine">…</span>
    </div>
  </section>

  <main class="content" id="topicsContainer"></main>

  <div class="empty-state hidden" id="emptyState"></div>

  <footer class="page-footer">
    <span id="footerText"></span>
  </footer>
</div>

<script src="assets/app.js"></script>
</body>
</html>
